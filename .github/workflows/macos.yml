name: MacOS
on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    build:
        name: Build
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                xcode-version: '15.4.0'
            - run: |
                brew install gmp
                git clone https://github.com/microsoft/vcpkg.git
                cd vcpkg
                ./bootstrap-vcpkg.sh
                ./vcpkg install boinc:x64-osx
                make -F src/mac64/Makefile.boinc
